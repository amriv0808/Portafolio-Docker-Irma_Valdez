<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Razas de Perros</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-weight: 600; font-size: 14px; color: #555; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #45a049; }
        #result { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; }
        .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🐶 Predicción de Raza</h2>
        <form id="dogForm">
            <div class="form-group">
                <label>Peso (kg):</label>
                <input type="number" step="0.1" id="weight" value="27.5" required>
            </div>
            <div class="form-group">
                <label>Altura (cm):</label>
                <input type="number" step="0.1" id="height" value="57.0" required>
            </div>
            <div class="form-group">
                <label>Nivel de energía (1-5):</label>
                <input type="number" min="1" max="5" id="energy" value="5" required>
            </div>
            <button type="submit">Predecir Raza</button>
        </form>

        <div id="result" class="success">
            <h3 id="breedResult" style="margin: 0;"></h3>
            <p id="confidenceResult" style="margin: 5px 0 0 0; font-size: 14px;"></p>
        </div>
    </div>

    <script>
        document.getElementById('dogForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                weight_kg: parseFloat(document.getElementById('weight').value),
                height_cm: parseFloat(document.getElementById('height').value),
                energy_level: parseInt(document.getElementById('energy').value)
            };

            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            document.getElementById('breedResult').innerText = "Raza: " + result.predicted_breed;
            document.getElementById('confidenceResult').innerText = "Confianza: " + (result.confidence * 100).toFixed(0) + "%";
            document.getElementById('result').style.display = 'block';
        });
    </script>
</body>
</html>
